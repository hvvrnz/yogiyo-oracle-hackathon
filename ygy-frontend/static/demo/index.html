<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>요기요 AI 통합 시연 콘솔</title>
  <link rel="stylesheet" href="/static/common.css" />
  <style>
    body{min-height:100vh;padding:22px;background:#111116;color:white}.demo-shell{max-width:1680px;margin:0 auto}.demo-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}.demo-head h1{margin:0;font-size:27px;letter-spacing:-1px}.demo-head p{margin:5px 0 0;color:#a8a8b3;font-size:13px}.demo-links{display:flex;gap:8px;flex-wrap:wrap}.demo-links a,.demo-links button{border:1px solid #35353e;color:white;background:#202028;border-radius:12px;padding:9px 12px;font-size:12px}.control-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;margin-bottom:16px}.panel{background:#1b1b22;border:1px solid #2a2a33;border-radius:20px;padding:16px}.panel h2{margin:0 0 12px;font-size:15px}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls select{border:1px solid #41414b;border-radius:12px;padding:10px 12px;background:#25252e;color:white;font-size:12px;min-width:190px}.controls button{border:0;border-radius:12px;padding:10px 13px;font-weight:750;font-size:12px;background:#2c2c36;color:white}.controls button.primary{background:var(--brand)}.controls button.warn{background:#7a4313}.controls button.good{background:#146c49}.summary-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.summary-box{background:#25252e;border-radius:14px;padding:12px}.summary-box span{display:block;color:#9696a2;font-size:10px;margin-bottom:5px}.summary-box strong{font-size:14px}.screens{display:grid;grid-template-columns:repeat(3,minmax(330px,1fr));gap:14px;align-items:start}.phone-panel{background:#1b1b22;border:1px solid #2a2a33;border-radius:22px;padding:12px}.phone-title{display:flex;justify-content:space-between;align-items:center;margin:2px 3px 10px}.phone-title strong{font-size:13px}.phone-title a{color:#aaa;font-size:11px}.phone-frame{width:100%;height:735px;border:0;border-radius:17px;background:#f5f5f8}.event-panel{margin-top:16px}.event-list{max-height:260px;overflow:auto;display:grid;gap:7px}.event{display:grid;grid-template-columns:105px 1fr auto;gap:10px;align-items:center;background:#24242c;border-radius:12px;padding:10px 12px;font-size:11px}.event code{color:#ff83aa}.event span{color:#d6d6dc}.event time{color:#858590}.status-line{display:flex;align-items:center;gap:7px;color:#a3a3ad;font-size:11px}.status-dot{width:8px;height:8px;border-radius:50%;background:#48c98b;box-shadow:0 0 0 4px rgba(72,201,139,.12)}@media(max-width:1200px){.screens{grid-template-columns:1fr 1fr}.phone-panel:last-child{grid-column:span 2}.control-grid{grid-template-columns:1fr}}@media(max-width:760px){body{padding:10px}.demo-head{align-items:flex-start;flex-direction:column}.screens{grid-template-columns:1fr}.phone-panel:last-child{grid-column:auto}.summary-grid{grid-template-columns:1fr 1fr}.phone-frame{height:700px}.event{grid-template-columns:1fr}.event time{display:none}}
  </style>
</head>
<body>
  <main class="demo-shell">
    <header class="demo-head"><div><h1>AI 조리·배달 동기화 통합 시연</h1><p>하나의 FastAPI 서버와 공통 상태를 고객·사장님·라이더 화면이 WebSocket으로 공유합니다.</p></div><div class="demo-links"><span class="status-line"><i class="status-dot"></i><span id="connectionText">서버 연결 중</span></span><a href="/docs" target="_blank">API 문서</a><a href="/">시작 화면</a></div></header>

    <section class="control-grid">
      <div class="panel"><h2>시나리오 제어</h2><div class="controls"><select id="datasetSelect" aria-label="가상 데이터 세트 선택"><option value="">데이터 세트 불러오는 중</option></select><button id="applyDataset" class="good">데이터 적용</button><button class="primary" data-endpoint="/api/demo/next">다음 단계 진행</button><button class="good" data-endpoint="/api/demo/rider-accept">현재 라이더 수락</button><button class="warn" data-endpoint="/api/demo/rider-reject">현재 라이더 거절</button><button class="warn" data-endpoint="/api/demo/rider-timeout">응답 시간 만료</button><button class="warn" data-endpoint="/api/demo/store-delay">버거 매장 +7분 지연</button><button data-endpoint="/api/demo/new-order">신규 주문 만들기</button><button class="primary" data-route-strategy="optimized">혼합 최적화</button><button class="good" data-route-strategy="pickup_first">전체 픽업 후 배달</button><button data-weather="RAIN">비 시나리오</button><button data-weather="CLEAR">맑음 시나리오</button><button data-simulation="true">위치 자동 이동</button><button data-simulation="false">이동 일시정지</button><button data-endpoint="/api/demo/reset">전체 초기화</button></div></div>
      <div class="panel"><h2>현재 패키지 요약</h2><div class="summary-grid"><div class="summary-box"><span>상태</span><strong id="summaryStatus">-</strong></div><div class="summary-box"><span>주문</span><strong id="summaryOrders">-건</strong></div><div class="summary-box"><span>예상 소요</span><strong id="summaryDuration">-분</strong></div><div class="summary-box"><span>경로 전략</span><strong id="summaryStrategy">-</strong></div><div class="summary-box"><span>시간당 수익</span><strong id="summaryRevenue">-원</strong></div><div class="summary-box"><span>현재 제안 라이더</span><strong id="summaryRider">-</strong></div><div class="summary-box"><span>이벤트 버전</span><strong id="summaryVersion">-</strong></div></div></div>
    </section>

    <section class="screens">
      <article class="phone-panel"><div class="phone-title"><strong>고객 C-001</strong><a href="/customer?customerId=C-001" target="_blank">새 창 ↗</a></div><iframe class="phone-frame" src="/customer?customerId=C-001" title="고객 화면"></iframe></article>
      <article class="phone-panel"><div class="phone-title"><strong>사장님 S-001</strong><a href="/merchant?storeId=S-001" target="_blank">새 창 ↗</a></div><iframe class="phone-frame" src="/merchant?storeId=S-001" title="사장님 화면"></iframe></article>
      <article class="phone-panel"><div class="phone-title"><strong id="riderFrameTitle">라이더 R-001</strong><a id="riderFrameLink" href="/rider?riderId=R-001" target="_blank">새 창 ↗</a></div><iframe id="riderFrame" class="phone-frame" src="/rider?riderId=R-001" title="라이더 화면"></iframe></article>
    </section>

    <section class="panel event-panel"><h2>실시간 이벤트 로그</h2><div id="eventList" class="event-list"></div></section>
  </main>
  <script src="/static/common.js"></script>
  <script src="/static/demo/app.js"></script>
</body>
</html>
