<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>요기요 사장님 · 주문 관리</title>
  <link rel="stylesheet" href="/static/common.css" />
</head>
<body>
  <div class="page-stage">
    <main class="mobile-shell" aria-label="사장님 주문 관리">
      <header class="app-header">
        <div class="header-title"><div class="brand-mark">샵</div><div><h1 id="merchantStoreName">매장 주문 관리</h1><p id="merchantStoreMeta">매장 정보를 확인 중</p></div></div>
        <div id="connection" class="connection-pill"><i></i><span>연결 중</span></div>
      </header>
      <div class="mobile-scroll">
        <section class="section">
          <div class="card">
            <div class="section-title-row"><h2>주문 현황</h2><button class="icon-button" aria-label="통합 시연으로 이동" title="통합 시연으로 이동" onclick="location.href='/demo'">↗</button></div>
            <div class="metric-grid">
              <div class="metric"><span class="metric-label">신규 주문</span><strong id="newCount">0</strong><small>건</small></div>
              <div class="metric"><span class="metric-label">조리 중</span><strong id="cookingCount">0</strong><small>건</small></div>
              <div class="metric"><span class="metric-label">배차 완료</span><strong id="readyCount">0</strong><small>건</small></div>
            </div>
          </div>
        </section>
        <section id="merchantLoadState" class="section" aria-live="polite" hidden></section>
        <div id="merchantContent">
          <section class="section">
            <div class="section-title-row"><h2>주문 목록</h2><span id="orderCountLabel">0건</span></div>
            <div id="merchantOrders"><div class="card skeleton"></div></div>
          </section>
          <section class="section">
            <div class="section-title-row"><h2>배차 정보</h2><span id="riderAssignedBadge" class="badge neutral">배정 전</span></div>
            <div class="card">
              <div class="row"><span class="label">배정 라이더</span><span class="value" id="assignedRiderId">-</span></div>
              <div class="row"><span class="label">현재 패키지</span><span class="value" id="packageStatus">-</span></div>
              <div class="row"><span class="label">패키지 주문 수</span><span class="value" id="packageSize">-</span></div>
              <div class="route-strategy-box"><strong>방문 순서</strong><span id="packageStrategy">방문 순서 정보 없음</span></div>
              <div class="notice info" style="margin-top:14px"><span>ⓘ</span><div><strong>주문 API 기준</strong><span id="packageReason">패키지와 라이더 정보는 주문 API 응답을 기준으로 표시합니다.</span></div></div>
            </div>
          </section>
        </div>
      </div>
      <nav class="bottom-nav"><a class="nav-item" href="/"><strong>⌂</strong><span>홈</span></a><div class="nav-item active"><strong>▤</strong><span>주문</span></div><div class="nav-item"><strong>◷</strong><span>조리</span></div><div class="nav-item"><strong>⌁</strong><span>통계</span></div></nav>
      <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    </main>
  </div>
  <script src="/static/common.js"></script>
  <script src="/static/merchant/app.js"></script>
</body>
</html>
